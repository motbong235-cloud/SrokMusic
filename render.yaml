services:
  - type: worker
    name: srokmusic-bot
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: PYTHON_VERSION
        value: "3.11.9"
    disk:
      name: srokmusic-data
      mountPath: /var/data
      sizeGB: 1
